<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Login</h1>
    <form action="processa_formulario.php" method="get">
        <!-- Action = para onde os dados vão / method = get - aparece na url post - não aparece na url-->
        <label for="nome">Nome: </label>
        <!-- Label define um rotulo para os elementos do formulario -->
        <input type="text" id="nome" name="nome" required> 
        <!-- Input = entrada de dados -->
        <br>
        <br>
        <label for="email">E-mail: </label> 
        <input type="email" id="email" name="email" required>
        <br>
        <br>
        <label for="assunto">Assunto: </label>
        <select id="assunto" name="assunto">
        <!-- Select = Menu suspenso -->
            <option value="orçamento">Orçamento</option>
            <!-- Ligado ao select, são as opções -->
            <option value="pagamento">Pagamento</option>
            <option value="outros">Outros</option>
        </select>
        <br>
        <br>
        <label for="msg">Mensagem: </label>
        <textarea name="message" id="msg" cols="50" rows="5"></textarea>
        <!-- Espaço para inserir texto maiores, com coluna e linhas
         definindo o tamanho, não limita o que o usuário irá inserir -->
        <button type="submit">Enviar</button>
        <button type="reset">Cancelar</button>
        <!-- Botão com ou sem ação -->
    </form>
</body>
</html>
